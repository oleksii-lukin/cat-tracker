# Критический путь 3: сводка за сегодня на вкладке статистики.
# Предполагает кота «Тестя» (01) и кормление из 02.
appId: com.llamerr.cattracker
name: '03 Stats summary'
---
- extendedWaitUntil:
    visible: 'Дневник'
    timeout: 60000

- tapOn: 'Статистика'

- extendedWaitUntil:
    visible: 'Статистика · Тестя'
    timeout: 15000

# Строка еды за сегодня. Точный текст зависит от состояния БД
# («Мокрый без объёма» на пустой базе, «Мокрый 2 лож. · Сухой 150 г» на seed) —
# поэтому матчится префикс строки, а не полный текст.
# Пол «Тести» неизвестен (01 не выбирает пол) → нейтральная «Поел(а):»,
# у seed-«Тести» пол female → «Поела:» — regex покрывает оба варианта.
- assertVisible: 'Поел.*:.*'
