# Критический путь 2: запись кормления через «Быструю запись».
# Предполагает кота от 01_first_cat. Дефолтный корм — пресет «Мокрый корм (ложки)»,
# количество 0 → в карточке и статистике отображается «без объёма».
# Порядок запуска флоузов не гарантирован — переходим на вкладку «Дневник» сами.
appId: com.llamerr.cattracker
name: '02 Add feeding'
---
- extendedWaitUntil:
    visible: 'Дневник'
    timeout: 60000

- tapOn: 'Дневник'

- extendedWaitUntil:
    visible: 'Быстрая запись'
    timeout: 10000

# Кнопка быстрой записи — по testID: текст «Поел(а)» совпадает с заголовком
# карточки уже сохранённого события (неоднозначность при повторном прогоне).
- tapOn:
    id: 'quickadd-food'

- extendedWaitUntil:
    visible: 'Сохранить событие'
    timeout: 10000

- tapOn: 'Сохранить событие'

# Карточка события в ленте журнала: название корма без количества.
- extendedWaitUntil:
    visible: 'Мокрый корм .ложки.'
    timeout: 15000

# Панель свернулась — форма сохранения скрыта.
- assertNotVisible: 'Сохранить событие'
